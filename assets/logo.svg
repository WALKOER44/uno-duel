<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <!-- ===================== BACKGROUND: GRAPH PAPER GRID ===================== -->
  <defs>
    <pattern id="gridMinor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9e9e9" stroke-width="1"/>
    </pattern>
    <pattern id="gridMajor" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#d8d8d8" stroke-width="1.5"/>
    </pattern>
    <!-- Gaya teks utama: sangat tebal & padat -->
    <style>
      .word {
        font-family: 'Arial Black', 'Arial Bold', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        font-stretch: condensed;
      }
    </style>
  </defs>

  <rect width="1200" height="460" fill="#ffffff"/>
  <rect width="1200" height="460" fill="url(#gridMinor)"/>
  <rect width="1200" height="460" fill="url(#gridMajor)"/>

  <!-- ===================== UNO (kiri): HITAM + bayangan kuning dobel ===================== -->
  <!-- Lapisan bayangan jauh -->
  <text x="340" y="215" text-anchor="middle" class="word" font-size="172" fill="#ffd400" transform="translate(18,18)">UNO</text>
  <!-- Lapisan bayangan dekat -->
  <text x="340" y="215" text-anchor="middle" class="word" font-size="172" fill="#ffea4d" transform="translate(9,9)">UNO</text>
  <!-- Teks utama hitam pekat -->
  <text x="340" y="215" text-anchor="middle" class="word" font-size="172" fill="#0a0a0a">UNO</text>

  <!-- ===================== DUEL (kanan): KUNING + bayangan hitam dobel ===================== -->
  <!-- Lapisan bayangan jauh -->
  <text x="860" y="215" text-anchor="middle" class="word" font-size="172" fill="#0a0a0a" transform="translate(18,18)">DUEL</text>
  <!-- Lapisan bayangan dekat -->
  <text x="860" y="215" text-anchor="middle" class="word" font-size="172" fill="#2a2a2a" transform="translate(9,9)">DUEL</text>
  <!-- Teks utama kuning cerah -->
  <text x="860" y="215" text-anchor="middle" class="word" font-size="172" fill="#ffd400">DUEL</text>

  <!-- ===================== TOMBOL PIL KUNING ===================== -->
  <rect x="140" y="300" width="920" height="66" rx="33" fill="#ffd400" stroke="#0a0a0a" stroke-width="3"/>
  <text x="600" y="336" text-anchor="middle" dominant-baseline="middle"
        class="word" font-size="22" letter-spacing="3" fill="#0a0a0a">PUBLIC ROOM • PRIVATE ROOM • SOLO TRAINING</text>
</svg>